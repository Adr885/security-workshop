name: COMSATS pipeline

on:
  push:
    branches: [main]

env:
  SITE_NAME: abdurrehman
  DEPLOY_HOST: abdurrehman.comsats.shakir.blog
  DEPLOY_PORT: "2280"
  DEPLOY_DIR: /var/www/html/abdurrehman/
  SOURCE_DIR: public/

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Check PHP syntax
        run: find "$SOURCE_DIR" -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l

  virus-scan:
    runs-on: ubuntu-latest
    needs: php-lint
    steps:
      - uses: actions/checkout@v4
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan files
        run: clamscan --recursive --infected --max-filesize=50M --max-scansize=200M "$SOURCE_DIR"

  deploy:
    runs-on: ubuntu-latest
    needs: virus-scan
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
      - name: Upload with rsync
        run: |
          rsync -rlvz --delete --chmod=D2750,F640 \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes" \
            "$SOURCE_DIR" "$SITE_NAME@$DEPLOY_HOST:$DEPLOY_DIR"
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_deploy